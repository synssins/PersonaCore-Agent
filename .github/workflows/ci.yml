name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with pyright
        run: pyright

      - name: Run pytest
        # Coverage floor is 75% (not 80%) while the subprocess-heavy integration
        # tests are CI-skipped for the Python 3.12 spawn race — task #10. Restore
        # to 80% once those tests can run on CI again.
        run: pytest -q --cov=workstation_agent --cov-report=term-missing --cov-fail-under=75
