name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v)"
        required: true
        default: "0.1.0"

jobs:
  release:
    runs-on: windows-latest
    env:
      PC_AGENT_SIGNING_PUBKEY: ${{ secrets.PC_AGENT_SIGNING_PUBKEY }}
      PC_AGENT_SIGNING_PRIVATE_KEY: ${{ secrets.PC_AGENT_SIGNING_PRIVATE_KEY }}
      PC_AGENT_CODESIGN_CERT_PATH: ${{ secrets.PC_AGENT_CODESIGN_CERT_PATH }}
      PC_AGENT_CODESIGN_CERT_PASSWORD: ${{ secrets.PC_AGENT_CODESIGN_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF.Substring("refs/tags/v".Length)
          } elseif ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "0.0.0-dev"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install Inno Setup (for building Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Add ISCC to PATH for this and subsequent steps in the same job.
          $inno = "C:\Program Files (x86)\Inno Setup 6"
          "$inno" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$inno\iscc.exe" /? | Select-String "^Inno Setup" | Select-Object -First 1

      - name: Run pytest (informational; does not gate publish)
        continue-on-error: true
        run: pytest -q

      - name: Boot check (gates publish)
        run: python scripts/boot_check.py --fake-backends

      - name: Build installer
        shell: pwsh
        run: |
          ./installer/build.ps1 -Version "${{ steps.ver.outputs.version }}" -Python "python"

      - name: Prepare release manifest
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dist = "dist"
          Compress-Archive -Path "$dist\Agent\*" -DestinationPath "$dist\agent-$v-win-x64.zip" -Force
          Copy-Item "$dist\Updater.exe" "$dist\updater-$v-win-x64.exe" -Force
          $agentZip = "$dist\agent-$v-win-x64.zip"
          $updaterExe = "$dist\updater-$v-win-x64.exe"
          $agentSha = (Get-FileHash -Algorithm SHA256 $agentZip).Hash.ToLower()
          $updSha   = (Get-FileHash -Algorithm SHA256 $updaterExe).Hash.ToLower()
          $agentSize = (Get-Item $agentZip).Length
          $updSize   = (Get-Item $updaterExe).Length
          $manifest = @{
            version              = $v
            channel              = "stable"
            released_at          = (Get-Date -AsUTC).ToString("o")
            mandatory            = $false
            notes_url            = "https://github.com/${{ github.repository }}/releases/tag/v$v"
            min_updater_version  = "0.1.0"
            artifacts = @{
              agent   = @{ url = "https://github.com/${{ github.repository }}/releases/download/v$v/agent-$v-win-x64.zip";   sha256 = $agentSha; size = $agentSize }
              updater = @{ url = "https://github.com/${{ github.repository }}/releases/download/v$v/updater-$v-win-x64.exe"; sha256 = $updSha;   size = $updSize }
            }
          }
          # Write to BOTH dist/manifest.json (for signing / uploads) and
          # repo-root manifest.json (spec §"Release workflow" naming).
          $json = ($manifest | ConvertTo-Json -Depth 6)
          $json | Out-File "$dist\manifest.json" -Encoding utf8
          $json | Out-File "manifest.json"      -Encoding utf8

      - name: Sign manifest (Ed25519)
        if: env.PC_AGENT_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          python scripts/sign_manifest.py dist/manifest.json
          # Mirror the .sig alongside the repo-root manifest.json for the
          # gh-release upload step below.
          Copy-Item "dist\manifest.json.sig" "manifest.json.sig" -Force

      - name: Authenticode-sign binaries (placeholder — no-op without cert)
        if: env.PC_AGENT_CODESIGN_CERT_PATH != ''
        shell: pwsh
        run: |
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue)
          if (-not $signtool) {
            Write-Warning "signtool.exe not found on PATH; skipping Authenticode signing"
            exit 0
          }
          & signtool.exe sign /f "$env:PC_AGENT_CODESIGN_CERT_PATH" /p "$env:PC_AGENT_CODESIGN_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Agent\Agent.exe dist\Updater.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: personacore-agent-${{ steps.ver.outputs.version }}
          path: |
            dist/agent-*.zip
            dist/updater-*.exe
            dist/Updater.exe
            dist/manifest.json
            dist/manifest.json.sig
            dist/PersonaCore-Agent-Setup-*.exe
            manifest.json
            manifest.json.sig

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          $title = "PersonaCore-Agent $tag"
          $isPrerelease = $tag -match "-(alpha|beta|rc|dev)"
          $notes = @"
Automated release for $tag.

**Install:** download ``PersonaCore-Agent-Setup-$v.exe`` below and run it. Per-user by default; pass ``/ALLUSERS`` on the command line for machine-wide install.

**Alpha caveats:**
- Not code-signed. SmartScreen will warn; click "More info" then "Run anyway".
- All 6 first-party plugins (filesystem/powershell/desktop_control/browser/screen_vision/clipboard) are stubs returning ``not_implemented``. Real implementations land in v0.2. Voice pipeline (wake -> STT -> LLM -> TTS) is fully wired against your OpenAI-compat + Wyoming endpoints.
"@
          # Collect artifacts only if they actually exist — signing/installer steps are conditional.
          $candidates = @(
            "dist\PersonaCore-Agent-Setup-$v.exe"
            "dist\agent-$v-win-x64.zip"
            "dist\Updater.exe"
            "dist\updater-$v-win-x64.exe"
            "manifest.json"
            "manifest.json.sig"
          )
          $assets = @()
          foreach ($c in $candidates) {
            if (Test-Path $c) { $assets += (Get-Item $c).FullName } else { Write-Host "skipping missing asset: $c" }
          }
          if ($assets.Count -eq 0) {
            throw "no release assets found — every candidate file was missing"
          }
          $args = @("release", "create", $tag, "--title", $title, "--notes", $notes)
          if ($isPrerelease) { $args += "--prerelease" }
          $args += $assets
          & gh @args
