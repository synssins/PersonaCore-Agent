name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v)"
        required: true
        default: "0.1.0"

permissions:
  contents: write  # required so GITHUB_TOKEN can create releases + upload assets

jobs:
  release:
    runs-on: windows-latest
    env:
      PC_AGENT_SIGNING_PUBKEY: ${{ secrets.PC_AGENT_SIGNING_PUBKEY }}
      PC_AGENT_SIGNING_PRIVATE_KEY: ${{ secrets.PC_AGENT_SIGNING_PRIVATE_KEY }}
      PC_AGENT_CODESIGN_CERT_PATH: ${{ secrets.PC_AGENT_CODESIGN_CERT_PATH }}
      PC_AGENT_CODESIGN_CERT_PASSWORD: ${{ secrets.PC_AGENT_CODESIGN_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF.Substring("refs/tags/v".Length)
          } elseif ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "0.0.0-dev"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install Inno Setup (for building Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Add ISCC to PATH for this and subsequent steps in the same job.
          $inno = "C:\Program Files (x86)\Inno Setup 6"
          "$inno" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$inno\iscc.exe" /? | Select-String "^Inno Setup" | Select-Object -First 1

      - name: Run pytest (informational; does not gate publish)
        id: pytest
        continue-on-error: true
        shell: pwsh
        run: |
          # Non-gating by design (continue-on-error above): a red suite must
          # never block a release. But it must not be silent either - this
          # step makes a bad run loud in three places: a ::error:: workflow
          # annotation, the job summary, and (thread via step outputs) the
          # published release notes. -rfE does not change what runs; it only
          # asks pytest to also print an explicit "FAILED <nodeid>" /
          # "ERROR <nodeid>" line per failure/error so we have something
          # machine-parseable.
          #
          # There are three distinct outcomes, not one boolean:
          #   ok       - pytest exited 0. All collected tests passed.
          #   reported - pytest exited non-zero and told us why (a "N failed"
          #              and/or "N error" count in its own summary line).
          #              Failures and errors are different problems (a test
          #              that failed vs. a test that couldn't even be
          #              collected) and are reported separately.
          #   unknown  - pytest exited non-zero but printed nothing this
          #              parser recognizes as a summary (crash, INTERNALERROR,
          #              killed process, a collection step that behaves
          #              differently run to run, etc.). This is the important
          #              one: it means the suite did not finish, so we must
          #              NOT guess a count and must say exactly that.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          & pytest -q -rfE | Tee-Object -Variable pytestLines
          $exitCode = $LASTEXITCODE

          $lastLine = ($pytestLines | Where-Object { $_.Trim() -ne '' } | Select-Object -Last 1)

          $hasFailed = $false
          $hasError = $false
          $failedCount = 0
          $errorCount = 0
          if ($lastLine -and ($lastLine -match '(\d+)\s+failed')) {
            $hasFailed = $true
            $failedCount = [int]$Matches[1]
          }
          if ($lastLine -and ($lastLine -match '(\d+)\s+errors?\b')) {
            $hasError = $true
            $errorCount = [int]$Matches[1]
          }

          function Get-NodeIds {
            param([string]$Prefix, [string[]]$Lines)
            $ids = @()
            $pattern = '^{0}\s+(.+)$' -f $Prefix
            foreach ($line in $Lines) {
              if ($line -match $pattern) {
                $rest = $Matches[1]
                $sepIdx = $rest.IndexOf(' - ')
                if ($sepIdx -ge 0) { $nodeId = $rest.Substring(0, $sepIdx) } else { $nodeId = $rest }
                $ids += $nodeId.Trim()
              }
            }
            return $ids
          }
          $failedTests = Get-NodeIds -Prefix 'FAILED' -Lines $pytestLines
          $erroredTests = Get-NodeIds -Prefix 'ERROR' -Lines $pytestLines

          if ($exitCode -eq 0) {
            $status = 'ok'
          } elseif ($hasFailed -or $hasError) {
            $status = 'reported'
          } else {
            $status = 'unknown'
          }

          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "failed_count=$failedCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "error_count=$errorCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delim1 = "EOF_$([guid]::NewGuid().ToString('N'))"
          "failed_tests<<$delim1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          ($failedTests -join "`n") | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delim1 | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delim2 = "EOF_$([guid]::NewGuid().ToString('N'))"
          "errored_tests<<$delim2" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          ($erroredTests -join "`n") | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delim2 | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($status -ne 'ok') {
            $maxList = 25

            if ($status -eq 'unknown') {
              $headline = "pytest exited with code $exitCode and produced no recognized pass/fail summary. The test suite did not complete, so its result is unknown - this is not the same as a passing suite."
            } else {
              $bits = @()
              if ($hasFailed) { $bits += "$failedCount test$(if ($failedCount -ne 1) {'s'}) failed" }
              if ($hasError) { $bits += "$errorCount test$(if ($errorCount -ne 1) {'s'}) could not be collected (error)" }
              $headline = "pytest reported: " + ($bits -join '; ') + "."
            }

            # 1. Loud in the run summary: a red workflow annotation.
            Write-Host "::error::$headline The build is published anyway (this step is informational / continue-on-error)."

            # 2. Loud in the job summary: what happened, and - when known -
            #    the failing/errored node ids, capped so it stays skimmable.
            $summary = New-Object System.Collections.Generic.List[string]
            if ($status -eq 'unknown') {
              $summary.Add("## :warning: pytest: suite did not complete")
            } else {
              $summary.Add("## :x: pytest: suite did not pass cleanly")
            }
            $summary.Add("")
            $summary.Add($headline)
            if ($status -eq 'reported') {
              $summary.Add("")
              $summary.Add("This is informational and does not block the release.")
              if ($hasFailed) {
                $summary.Add("")
                $summary.Add("**Failed:**")
                $shown = $failedTests | Select-Object -First $maxList
                foreach ($t in $shown) {
                  $safe = $t -replace '`', "'"
                  $summary.Add("- ``$safe``")
                }
                if ($failedTests.Count -gt $maxList) {
                  $summary.Add("- ...and $($failedTests.Count - $maxList) more")
                }
              }
              if ($hasError) {
                $summary.Add("")
                $summary.Add("**Errored (could not be collected):**")
                $shown = $erroredTests | Select-Object -First $maxList
                foreach ($t in $shown) {
                  $safe = $t -replace '`', "'"
                  $summary.Add("- ``$safe``")
                }
                if ($erroredTests.Count -gt $maxList) {
                  $summary.Add("- ...and $($erroredTests.Count - $maxList) more")
                }
              }
            }
            ($summary -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Boot check (gates publish)
        run: python scripts/boot_check.py --fake-backends

      - name: Build installer
        shell: pwsh
        run: |
          ./installer/build.ps1 -Version "${{ steps.ver.outputs.version }}" -Python "python"

      - name: Prepare release manifest
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dist = "dist"
          Compress-Archive -Path "$dist\Agent\*" -DestinationPath "$dist\agent-$v-win-x64.zip" -Force
          Copy-Item "$dist\Updater.exe" "$dist\updater-$v-win-x64.exe" -Force
          $agentZip = "$dist\agent-$v-win-x64.zip"
          $updaterExe = "$dist\updater-$v-win-x64.exe"
          $agentSha = (Get-FileHash -Algorithm SHA256 $agentZip).Hash.ToLower()
          $updSha   = (Get-FileHash -Algorithm SHA256 $updaterExe).Hash.ToLower()
          $agentSize = (Get-Item $agentZip).Length
          $updSize   = (Get-Item $updaterExe).Length
          $manifest = @{
            version              = $v
            channel              = "stable"
            released_at          = (Get-Date -AsUTC).ToString("o")
            mandatory            = $false
            notes_url            = "https://github.com/${{ github.repository }}/releases/tag/v$v"
            min_updater_version  = "0.1.0"
            artifacts = @{
              agent   = @{ url = "https://github.com/${{ github.repository }}/releases/download/v$v/agent-$v-win-x64.zip";   sha256 = $agentSha; size = $agentSize }
              updater = @{ url = "https://github.com/${{ github.repository }}/releases/download/v$v/updater-$v-win-x64.exe"; sha256 = $updSha;   size = $updSize }
            }
          }
          # Write to BOTH dist/manifest.json (for signing / uploads) and
          # repo-root manifest.json (spec §"Release workflow" naming).
          $json = ($manifest | ConvertTo-Json -Depth 6)
          $json | Out-File "$dist\manifest.json" -Encoding utf8
          $json | Out-File "manifest.json"      -Encoding utf8

      - name: Sign manifest (Ed25519)
        if: env.PC_AGENT_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          python scripts/sign_manifest.py dist/manifest.json
          # Mirror the .sig alongside the repo-root manifest.json for the
          # gh-release upload step below.
          Copy-Item "dist\manifest.json.sig" "manifest.json.sig" -Force

      - name: Authenticode-sign binaries (placeholder — no-op without cert)
        if: env.PC_AGENT_CODESIGN_CERT_PATH != ''
        shell: pwsh
        run: |
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue)
          if (-not $signtool) {
            Write-Warning "signtool.exe not found on PATH; skipping Authenticode signing"
            exit 0
          }
          & signtool.exe sign /f "$env:PC_AGENT_CODESIGN_CERT_PATH" /p "$env:PC_AGENT_CODESIGN_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Agent\Agent.exe dist\Updater.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: personacore-agent-${{ steps.ver.outputs.version }}
          path: |
            dist/agent-*.zip
            dist/updater-*.exe
            dist/Updater.exe
            dist/manifest.json
            dist/manifest.json.sig
            dist/PersonaCore-Agent-Setup-*.exe
            manifest.json
            manifest.json.sig

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          $title = "PersonaCore-Agent $tag"
          $isPrerelease = $tag -match "-(alpha|beta|rc|dev)"
          $notesLines = @()
          $suiteStatus = "${{ steps.pytest.outputs.status }}"
          if ($suiteStatus -ne "ok") {
            $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if ($suiteStatus -eq "unknown") {
              $exitCode = "${{ steps.pytest.outputs.exit_code }}"
              $warningLine = "> **The test suite did not complete on this build (pytest exited with code $exitCode and produced no summary) - the result is unknown, but the build was published anyway.** See the [workflow run]($runUrl) for the raw log."
            } else {
              $failedCount = [int]"${{ steps.pytest.outputs.failed_count }}"
              $errorCount = [int]"${{ steps.pytest.outputs.error_count }}"
              $bits = @()
              if ($failedCount -gt 0) { $bits += "$failedCount test$(if ($failedCount -ne 1) {'s'}) failed" }
              if ($errorCount -gt 0) { $bits += "$errorCount test$(if ($errorCount -ne 1) {'s'}) could not be collected" }
              $summaryBits = $bits -join ", "
              $warningLine = "> **Test suite did not pass cleanly on this build: $summaryBits, but the build was published anyway.** See the [workflow run]($runUrl) for which tests failed."
            }
            $notesLines += "> [!WARNING]"
            $notesLines += $warningLine
            $notesLines += ""
          }
          $notesLines += "Automated release for $tag."
          $notesLines += ""
          $notesLines += "Install: download PersonaCore-Agent-Setup-$v.exe below and run it. Per-user by default; pass /ALLUSERS on the command line for machine-wide install."
          $notesLines += ""
          $notesLines += "Alpha caveats:"
          $notesLines += "- Not code-signed. SmartScreen will warn; click More info then Run anyway."
          $notesLines += "- The six first-party plugins (filesystem, powershell, desktop_control, browser, screen_vision, clipboard) are stubs returning not_implemented. Real implementations land in v0.2. The voice pipeline (wake, STT, LLM, TTS) is fully wired against your OpenAI-compat and Wyoming endpoints."
          $notes = ($notesLines -join "`n")
          # Collect artifacts only if they actually exist - signing/installer steps are conditional.
          $candidates = @(
            "dist\PersonaCore-Agent-Setup-$v.exe"
            "dist\agent-$v-win-x64.zip"
            "dist\Updater.exe"
            "dist\updater-$v-win-x64.exe"
            "manifest.json"
            "manifest.json.sig"
          )
          $assets = @()
          foreach ($c in $candidates) {
            if (Test-Path $c) { $assets += (Get-Item $c).FullName } else { Write-Host "skipping missing asset: $c" }
          }
          if ($assets.Count -eq 0) {
            throw "no release assets found — every candidate file was missing"
          }
          $args = @("release", "create", $tag, "--title", $title, "--notes", $notes)
          if ($isPrerelease) { $args += "--prerelease" }
          $args += $assets
          & gh @args
