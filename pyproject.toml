[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workstation-agent"
version = "0.1.0.dev0"
description = "PersonaCore-Agent: Windows-first voice-controlled AI agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chris (synssins)", email = "synssins@gmail.com" }]

dependencies = [
    "openwakeword>=0.6,<1.0",
    "wyoming>=1.0,<2.0",
    "httpx>=0.23,<1.0",
    "structlog>=21.0,<22.0",
    "pydantic>=2.0,<3.0",
    "pystray>=0.15,<1.0",
    "pywebview>=4.0,<5.0",
    "fastapi>=0.95,<1.0",
    "uvicorn>=0.21,<1.0",
    "jinja2>=3.0,<4.0",
    "keyboard>=0.13,<1.0",
    "pywin32>=300,<400",
    "cryptography>=41.0,<42.0",
    "pynacl>=1.5,<2.0",
    "click>=8.0,<9.0",
    "tomlkit>=0.11,<1.0",
    "claude-agent-sdk>=0.1,<1.0",
    "pyautogui>=0.9,<1.0",
    "pywinauto>=0.6,<1.0",
    "mss>=9.0,<10.0",
    "pytesseract>=0.3,<1.0",
    "playwright>=1.40,<2.0",
    "sounddevice>=0.4,<1.0",
    "webrtcvad-wheels>=2.0,<3.0",
    "psutil>=5.0,<6.0",
    "mcp>=0.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "pytest-asyncio>=0.21,<1.0",
    "pytest-cov>=4.0,<5.0",
    "pytest-httpserver>=1.0,<2.0",
    "ruff>=0.1,<1.0",
    "pyright>=1.1,<2.0",
    "pyinstaller>=6.0,<7.0",
    "respx>=0.20,<1.0",
    "dirty-equals>=0.6,<1.0",
]

[project.scripts]
workstation-agent = "workstation_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workstation_agent"]
