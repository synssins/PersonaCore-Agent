[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workstation-agent"
version = "0.1.0.dev0"
description = "PersonaCore-Agent: Windows-first voice-controlled AI agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chris (synssins)", email = "synssins@gmail.com" }]

dependencies = [
    "openwakeword>=0.6,<1.0",
    "wyoming>=1.0,<2.0",
    "httpx>=0.23,<1.0",
    "structlog>=21.0,<22.0",
    "pydantic>=2.0,<3.0",
    "pystray>=0.15,<1.0",
    "pywebview>=4.0,<5.0",
    "fastapi>=0.95,<1.0",
    "uvicorn>=0.21,<1.0",
    "jinja2>=3.0,<4.0",
    "keyboard>=0.13,<1.0",
    "pywin32>=300,<400",
    "cryptography>=41.0,<42.0",
    "pynacl>=1.5,<2.0",
    "click>=8.0,<9.0",
    "tomlkit>=0.11,<1.0",
    "claude-agent-sdk>=0.1,<1.0",
    "pyautogui>=0.9,<1.0",
    "pywinauto>=0.6,<1.0",
    "mss>=9.0,<10.0",
    "pytesseract>=0.3,<1.0",
    "playwright>=1.40,<2.0",
    "sounddevice>=0.4,<1.0",
    "webrtcvad-wheels>=2.0,<3.0",
    "psutil>=5.0,<6.0",
    "mcp>=2.1.1,<2.2",
    "pyserial>=3.5,<4.0",
    "winrt-runtime>=3.2,<3.3",
    "winrt-Windows.UI.Notifications>=3.2,<3.3",
    "winrt-Windows.Data.Xml.Dom>=3.2,<3.3",
    "winrt-Windows.Foundation>=3.2,<3.3",
]
# Note on the `winrt-*` set, added by subtask P5 (contract §11 items 2 and 7 —
# `shell_run`, `adb_*`, `files_write`, `serial_*` all require an operator
# confirmation, and the only presentation surface for that is a Windows
# toast): `toast.py` imports two namespaces directly
# (`winrt.windows.ui.notifications`, `winrt.windows.data.xml.dom`), but that
# is NOT the complete runtime dependency set. `ToastNotification.add_activated`
# — used for every confirm-flow toast, since Allow/Deny buttons are wired via
# it — takes a `Windows.Foundation.TypedEventHandler`, so
# `winrt-Windows.Foundation` is required too even though no code in this repo
# imports it by name; without it, `add_activated()` raises
# `ModuleNotFoundError` the first time a confirm toast is shown, which
# `ToastPresenter.show()` catches and logs, silently turning every
# always-prompt tool into a no-op toast (and, via `confirm.py`'s
# fail-closed design, a deny — safe, but not what an operator installing
# these four packages would expect "toasts enabled" to mean). Verified by
# hand: `create_toast_notifier_with_id(...)` and a bare `.show(notif)`
# succeed with just the two directly-imported namespaces installed;
# `notif.add_activated(...)` only succeeds once `winrt-Windows.Foundation`
# is present too. `winrt-Windows.Foundation.Collections` (needed only for
# `ToastNotificationManager.history.get_history_with_id`, which this repo
# never calls) is deliberately NOT declared here.
#   * Licence: MIT (each of these four is the `winrt` project's own PyPI
#     distribution, https://pypi.org/project/winrt-runtime/ and siblings).
#   * All four are pinned to the same `3.2.x` line because they are
#     independently-versioned native-extension namespace packages generated
#     from the same WinRT metadata sweep; mixing major/minor versions across
#     them is unsupported by the project.

# Note on `pyserial` (import name `serial`), added by subtask B8 for the
# `serial` family (contract §5.5, §6): `serial.Serial` backs
# serial_open/write/read/close's actual device I/O, and `serial.tools.list_ports`
# backs serial_ports. B8 owns adding this dependency; B7's `devices_list` also
# uses `serial.tools.list_ports` and was told to rely on B8 having added it
# rather than adding it a second time.
#
#   * Licence: BSD-3-Clause (Chris Liechti and contributors, pyserial project).
#     Permissive, compatible with this project's MIT licence, and needs no
#     attribution beyond this record — this comment IS the repo's dependency
#     record for it, in the same place and the same way the `mcp` note above
#     records its own reasoning.
#   * No alternative was seriously considered: pyserial is the de facto
#     standard cross-platform serial library for Python and is what the
#     contract itself names ("`pyserial` (BSD-3); §5.5 sessions").
#   * `>=3.5,<4.0` pins the current stable major line (3.5, 2020-03) with room
#     for patch releases; there is no 4.x to plan around yet.
# Note on `mcp`, amended by subtask B4 (full reasoning in
# src/workstation_agent/network_mcp/DECISION.md):
#
#   * The STDIO CLIENT rejection still stands. SPEC-03A implements the MCP
#     JSON-RPC stdio protocol inline (mcp_host/mcp_client.py) because the `mcp`
#     package's stdio_client spawns the subprocess itself and bypasses our
#     env-whitelist and Job Object isolation. Do not replace MCPStdioClient.
#   * The SERVER TRANSPORT is now the package's. The LAN endpoint
#     (network_mcp/) uses mcp's streamable-HTTP server so that the wire protocol
#     matches, byte for byte, the mcp client PersonaCore's core connects with —
#     session ids, protocol-version negotiation, SSE framing and resumability.
#     A tool-list/manifest mismatch is a terminal load failure on the core and
#     hands-on acceptance is externally blocked, so protocol conformance cannot
#     be verified by hand and must not be hand-rolled. That transport spawns no
#     subprocess, so the isolation objection above does not reach it.
#   * The old "it will conflict with PersonaCore's pinned mcp 2.x" reason is
#     obsolete: this project has its own venv at .venv/ (see CLAUDE.md). The
#     package was already resolved into it as a direct requirement of
#     claude-agent-sdk; declaring it here makes an existing dependency honest.
#   * Authentication and every input bound live in our own ASGI middleware in
#     front of the SDK app, not in the SDK. See network_mcp/hardening.py.

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "pytest-asyncio>=0.21,<1.0",
    "pytest-cov>=4.0,<5.0",
    "pytest-httpserver>=1.0,<2.0",
    "pytest-timeout>=2.1,<3.0",
    "ruff>=0.1,<1.0",
    "pyright>=1.1,<2.0",
    "pyinstaller>=6.0,<7.0",
    "respx>=0.20,<1.0",
    "dirty-equals>=0.6,<1.0",
]

[project.scripts]
workstation-agent = "workstation_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workstation_agent"]
