id = "clipboard"
name = "Clipboard"
version = "0.1.0"
runtime = "python"
entry = ["-m", "workstation_agent.plugins.clipboard"]
declared_permissions = [
  "tool:clipboard.get",
  "tool:clipboard.set",
  "tool:clipboard.clear",
  "clipboard.read",
  "clipboard.write",
  "args:clipboard.get:read",
  "args:clipboard.set:action:!text=opaque",
  "args:clipboard.clear:action",
]
confirmable_conditions = []

[compat]
min_host_version = "0.1.0"
