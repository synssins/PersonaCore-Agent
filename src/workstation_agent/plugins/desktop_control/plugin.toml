id = "desktop_control"
name = "Desktop Control"
version = "0.1.0"
runtime = "python"
entry = ["-m", "workstation_agent.plugins.desktop_control"]
declared_permissions = [
  "tool:desktop.click",
  "tool:desktop.type",
  "tool:desktop.key",
  "tool:desktop.list_windows",
  "tool:desktop.focus_window",
  "desktop.control",
  "args:desktop.click:action:!x=opaque,!y=opaque",
  "args:desktop.type:action:!text=opaque",
  "args:desktop.key:action:!combo=opaque",
  "args:desktop.list_windows:read",
  "args:desktop.focus_window:action:!title_pattern=opaque",
]
confirmable_conditions = []

[compat]
min_host_version = "0.1.0"
